<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Render 3D - Profesional</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        /* Reset total de márgenes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* TRUCO KEYSHOT 1: El fondo no puede ser plano. 
           Usamos un degradado radial sutil que simula un estudio fotográfico real (Infinity Backdrop) 
           manteniendo la base de tu color #FBF4EC en el centro. */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #FFFF 30%, #FBF4EC 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Contenedor del render 3D */
        model-viewer {
            width: 100vw;
            height: 100vh;
            display: block;
            contain: strict;
            /* Hacemos que el fondo de model-viewer sea transparente para que use nuestro degradado CSS */
            background-color: transparent; 
            --poster-color: transparent;
        }

        /* Pantalla de carga integrada elegante */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #FBF4EC 30%, #EFE3D3 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
            z-index: 10;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Spinner estilo minimalista premium */
        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(74, 59, 50, 0.08);
            border-top: 2px solid #5C4A3E;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-bottom: 16px;
        }

        .loading-title {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #5C4A3E;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .progress-container {
            width: 120px;
            height: 2px;
            background-color: rgba(74, 59, 50, 0.08);
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #5C4A3E;
            transition: width 0.15s ease-out;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <model-viewer
        src="modelo.glb"
        alt="Render Industrial 3D"
        
        /* 1. CONTROL DE LUCES Y TONO (Adiós al brillo exagerado) */
        environment-image="neutral"
        tone-mapping="agx"            /* AgX es el nuevo estándar de Blender 4+ para transiciones de luz ultra realistas */
        exposure="0.68"               /* Bajamos la exposición drásticamente para que no se queme el blanco y se vean texturas */
        
        /* 2. SOMBRAS DE CONTACTO ULTRA SUAVES */
        shadow-intensity="1.8"        /* Sombra oscura justo debajo de la pieza */
        shadow-softness="0.9"         /* Difuminado suave para que parezca luz de ventana/softbox */
        
        /* 3. TRUCO KEYSHOT 2: LENTE TELEFOTO (Menos distorsión) */
        field-of-view="22deg"         /* Un FOV bajo aplana la perspectiva, dando ese look de catálogo de ingeniería */
        camera-orbit="45deg 65deg auto"
        interpolation-decay="25"      /* Movimiento de cámara súper fluido y pesado */
        camera-controls
        touch-action="none"
        
        /* 4. LÍMITES DE SEGURIDAD */
        max-polar-angle="90deg"       /* Impide que el usuario mire la pieza desde abajo del suelo */
        min-camera-orbit="auto auto 1m"
        max-camera-orbit="auto auto 12m"
        
        /* 5. GIRO AUTOMÁTICO ELEGANTE */
        auto-rotate
        auto-rotate-delay="500"
        rotation-per-second="8deg"    /* Giro lento y profesional, no un torbellino */
        
        /* Opciones de Realidad Aumentada integradas */
        ar
        ar-modes="webxr scene-viewer quick-look">

        <div slot="poster" id="custom-loading" class="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-title">Cargando Render</div>
            <div class="progress-container">
                <div id="bar" class="progress-bar"></div>
            </div>
        </div>

    </model-viewer>

    <script>
        const modelViewer = document.querySelector('model-viewer');
        const progressBar = document.getElementById('bar');
        const loadingOverlay = document.getElementById('custom-loading');

        // Control del porcentaje de carga del archivo .glb
        modelViewer.addEventListener('progress', (event) => {
            const progress = event.detail.totalProgress * 100;
            progressBar.style.width = `${progress}%`;
            
            if (progress >= 100) {
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                }, 200);
            }
        });

        // Doble verificación para ocultar la carga cuando el motor 3D esté listo
        modelViewer.addEventListener('load', () => {
            loadingOverlay.classList.add('hidden');
        });
    </script>

</body>
</html>
