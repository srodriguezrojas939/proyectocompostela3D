<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Render 3D - Alto Contraste</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Reset total de márgenes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fondo de estudio fotográfico infinito */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #FBF4EC 30%, #EFE3D3 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Contenedor del render 3D */
        model-viewer {
            width: 100vw;
            height: 100vh;
            display: block;
            contain: strict;
            background-color: transparent; 
            --poster-color: transparent;
        }

        /* Pantalla de carga integrada elegante */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #FBF4EC 30%, #EFE3D3 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
            z-index: 10;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Spinner estilo minimalista premium */
        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(74, 59, 50, 0.08);
            border-top: 2px solid #5C4A3E;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-bottom: 16px;
        }

        .loading-title {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #5C4A3E;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .progress-container {
            width: 120px;
            height: 2px;
            background-color: rgba(74, 59, 50, 0.08);
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #5C4A3E;
            transition: width 0.15s ease-out;
        }

        /* INTERFAZ DEL INTERCAMBIADOR DE MODELOS Premium */
        .model-switcher {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(74, 59, 50, 0.15);
            box-shadow: 0 10px 30px rgba(74, 59, 50, 0.12);
            z-index: 5;
        }

        .switch-btn {
            background-color: #FFFFFF;
            border: 1px solid rgba(74, 59, 50, 0.15);
            color: #5C4A3E;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .switch-btn:hover {
            background-color: #5C4A3E;
            color: #FBF4EC;
            border-color: #5C4A3E;
            transform: scale(1.05);
        }

        .switch-btn:active {
            transform: scale(0.95);
        }

        .model-label {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #5C4A3E;
            font-weight: 700;
            min-width: 130px;
            text-align: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="model-switcher">
        <button class="switch-btn" id="prev-btn" title="Modelo Anterior">
            <i data-lucide="chevron-left" stroke-width="2.5" size="18"></i>
        </button>
        <div class="model-label" id="model-text">Tapa cerrada</div>
        <button class="switch-btn" id="next-btn" title="Siguiente Modelo">
            <i data-lucide="chevron-right" stroke-width="2.5" size="18"></i>
        </button>
    </div>

  <model-viewer
        id="viewer"
        src="modelo.glb"
        alt="Render Industrial 3D"
        
        /* 1. CONTROL DE LUZ: Bajamos la exposición para eliminar el brillo exagerado y recuperar sombras internas */
        environment-image="neutral"
        tone-mapping="agx"            
        exposure="0.55"               /* Al bajarlo a 0.55 el objeto deja de brillar y los huecos se oscurecen naturalmente */
        
        /* 2. SOMBRA DEL PISO: Regresa a ser suave y sutil como al principio */
        shadow-intensity="1.8"        /* Intensidad original para el suelo */
        shadow-softness="0.9"         /* Difuminado alto original para que no sea un parche negro */
        
        /* 3. LENTE TELEFOTO (Look KeyShot de ingeniería) */
        field-of-view="22deg"         
        camera-orbit="45deg 65deg auto"
        interpolation-decay="25"      
        camera-controls
        touch-action="none"
        
        /* 4. LÍMITES DE SEGURIDAD */
        max-polar-angle="90deg"       
        min-camera-orbit="auto auto 1m"
        max-camera-orbit="auto auto 12m"
        
        /* 5. GIRO AUTOMÁTICO */
        auto-rotate
        auto-rotate-delay="500"
        rotation-per-second="8deg"    
        
        /* Opciones de Realidad Aumentada */
        ar
        ar-modes="webxr scene-viewer quick-look">

        <div slot="poster" id="custom-loading" class="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-title">Cargando Render</div>
            <div class="progress-container">
                <div id="bar" class="progress-bar"></div>
            </div>
        </div>

    </model-viewer>

    <script>
        const modelViewer = document.getElementById('viewer');
        const progressBar = document.getElementById('bar');
        const loadingOverlay = document.getElementById('custom-loading');
        
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const modelText = document.getElementById('model-text');

        // Configuración de la lista de archivos con tus nuevas etiquetas
        const modelsList = [
            { src: 'modelo.glb', label: 'Tapa cerrada' },
            { src: 'modelo2.glb', label: 'Tapa abierta' }
        ];
        let currentModelIndex = 0;

        // Inicializar los iconos de Lucide
        lucide.createIcons();

        // Función para alternar el modelo 3D
        function changeModel(index) {
            currentModelIndex = index;
            
            // Re-activar pantalla de carga e inicializar barra
            loadingOverlay.classList.remove('hidden');
            progressBar.style.width = '0%';
            
            // Actualizar origen de archivo y etiqueta de texto
            modelViewer.src = modelsList[currentModelIndex].src;
            modelText.innerText = modelsList[currentModelIndex].label;
        }

        // Listeners para las flechas de navegación
        prevBtn.addEventListener('click', () => {
            let nextIndex = currentModelIndex - 1;
            if (nextIndex < 0) nextIndex = modelsList.length - 1;
            changeModel(nextIndex);
        });

        nextBtn.addEventListener('click', () => {
            let nextIndex = (currentModelIndex + 1) % modelsList.length;
            changeModel(nextIndex);
        });

        // Control de porcentaje de carga
        modelViewer.addEventListener('progress', (event) => {
            const progress = event.detail.totalProgress * 100;
            progressBar.style.width = `${progress}%`;
            
            if (progress >= 100) {
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                }, 200);
            }
        });

        // Ocultar carga cuando esté completamente listo el render
        modelViewer.addEventListener('load', () => {
            loadingOverlay.classList.add('hidden');
        });
    </script>

</body>
</html>
